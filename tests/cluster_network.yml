---
- name: Verify DNS and service traffic between two worker nodes
  hosts: '{{ control_plane_hosts }}[0]'
  become: true
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars_files:
    - ../setup/vars/common.yml
  tasks:
    - name: Read available worker nodes
      ansible.builtin.command: kubectl get nodes -o json
      register: network_nodes
      changed_when: false
    - name: Collect worker names
      ansible.builtin.set_fact:
        network_workers: []
    - name: Select workers without a control-plane role
      ansible.builtin.set_fact:
        network_workers: '{{ network_workers + [item.metadata.name] }}'
      loop: '{{ (network_nodes.stdout | from_json)[''items''] }}'
      loop_control:
        label: '{{ item.metadata.name }}'
      when: item.metadata.labels['node-role.kubernetes.io/control-plane'] is not defined
    - name: Require two workers for a cross-node test
      ansible.builtin.assert:
        that: network_workers | length >= 2
    - name: Select a unique temporary namespace
      ansible.builtin.set_fact:
        network_test_namespace: kubeadm-netcheck-{{ now(utc=true, fmt="%Y%m%d%H%M%S") }}
    - name: Run the isolated network test
      block:
        - name: Create the temporary namespace
          ansible.builtin.command: kubectl create namespace {{ network_test_namespace }}
          register: network_namespace_created
          changed_when: true
        - name: Create a small backend and a client on different workers
          ansible.builtin.include_tasks: ../setup/tasks/apply_manifest.yml
          vars:
            manifest_definition:
              apiVersion: v1
              kind: List
              items:
                - apiVersion: v1
                  kind: Pod
                  metadata:
                    name: backend
                    namespace: '{{ network_test_namespace }}'
                    labels:
                      app: network-backend
                  spec:
                    nodeName: '{{ network_workers[0] }}'
                    containers:
                      - name: backend
                        image: docker.io/library/busybox:1.37.0
                        imagePullPolicy: IfNotPresent
                        command:
                          - sh
                          - -c
                          - mkdir -p /www && echo cluster-network-ok > /www/index.html && exec httpd -f -p
                            8080 -h /www
                        resources:
                          requests:
                            cpu: 10m
                            memory: 8Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        readinessProbe:
                          httpGet:
                            path: /
                            port: 8080
                - apiVersion: v1
                  kind: Pod
                  metadata:
                    name: client
                    namespace: '{{ network_test_namespace }}'
                  spec:
                    nodeName: '{{ network_workers[1] }}'
                    containers:
                      - name: client
                        image: docker.io/library/busybox:1.37.0
                        imagePullPolicy: IfNotPresent
                        command:
                          - sleep
                          - '300'
                        resources:
                          requests:
                            cpu: 5m
                            memory: 8Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: backend
                    namespace: '{{ network_test_namespace }}'
                  spec:
                    selector:
                      app: network-backend
                    ports:
                      - port: 80
                        targetPort: 8080
        - name: Prepare pending test images through the controller cache
          ansible.builtin.include_tasks: ../setup/tasks/preload_pod_images.yml
        - name: Wait for both test pods
          ansible.builtin.command: kubectl wait pods --all -n {{ network_test_namespace }} --for=condition=Ready
            --timeout=180s
          changed_when: false
        - name: Verify Kubernetes service DNS
          ansible.builtin.command: kubectl exec -n {{ network_test_namespace }} client -- nslookup kubernetes.default.svc.cluster.local
          changed_when: false
        - name: Verify cross-worker service traffic and DNS
          ansible.builtin.command: kubectl exec -n {{ network_test_namespace }} client -- wget -qO- -T 15 http://backend.{{
            network_test_namespace }}.svc.cluster.local
          register: network_http
          changed_when: false
        - name: Require the expected backend response
          ansible.builtin.assert:
            that: network_http.stdout | trim == 'cluster-network-ok'
      always:
        - name: Remove only the namespace created by this test
          ansible.builtin.command: kubectl delete namespace {{ network_test_namespace }} --wait=true --timeout=120s
          when: network_namespace_created is defined and network_namespace_created is succeeded
          changed_when: true
