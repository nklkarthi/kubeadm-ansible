---
- name: Verify platform supply-chain analysis and local signature checks
  ansible.builtin.include_tasks: supply_chain.yml
- name: Verify platform image delivery from a declared build
  ansible.builtin.include_tasks: image_build.yml
- name: Verify shared workload and service behavior once
  ansible.builtin.include_tasks: kcna.yml
- name: Verify platform tenancy, admission and capacity boundaries
  ansible.builtin.include_tasks: workload_boundaries.yml
- name: Verify platform delivery, observability, policy and self-service
  ansible.builtin.include_tasks: '{{ platform_check }}.yml'
  loop: [cgoa, storage_routes, pca, workflows, rollouts, otca, kca, crossplane, cba, ica]
  loop_control:
    loop_var: platform_check
  vars:
    certification_verify_core: false
