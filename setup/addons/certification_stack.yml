---
- name: Install the explicitly selected syllabus components
  hosts: '{{ control_plane_hosts }}[0]'
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars_files:
    - ../vars/common.yml
  tasks:
    - name: Require a known component selection
      ansible.builtin.assert:
        that: certification_addons | default([]) | difference(native_stack_components + playbook_components)
          | length == 0
    - name: Install selected components in dependency order
      ansible.builtin.include_tasks: ../tasks/addons/{{ stack_component }}.yml
      loop: '{{ certification_addons | default([]) | select("in", native_stack_components) | list }}'
      loop_control:
        loop_var: stack_component
