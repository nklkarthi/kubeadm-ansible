---
- name: Historical ingress-nginx lab installer
  hosts: '{{ control_plane_hosts }}[0]'
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    nginx_version: '{{ nginx_ingress_version | default(tool_versions.ingress_nginx) }}'
    addon_namespace: ingress-nginx
    tool_name: Retired ingress-nginx final release
    tool_kubernetes_min: 1.31.0
    tool_kubernetes_max: 1.36.0
  tasks:
    - name: Require explicit historical-lab use of the retired controller
      ansible.builtin.assert:
        that:
          - allow_retired_ingress_nginx | default(false) | bool
        fail_msg: ingress-nginx retired in March 2026. Use the maintained Istio gateway for this 1.37 lab.
          Historical labs require allow_retired_ingress_nginx=true and a supported older cluster.
    - name: Run tasks/cluster_access.yml
      ansible.builtin.import_tasks: ../tasks/cluster_access.yml
      tags:
        - compatibility
    - name: Run tasks/download_apply.yml
      ansible.builtin.import_tasks: ../tasks/download_apply.yml
      vars:
        manifest_url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-{{ nginx_version
          }}/deploy/static/provider/baremetal/deploy.yaml
        manifest_name: legacy-ingress-nginx-{{ nginx_version }}
    - name: Set non-conflicting historical lab ports
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - service
          - ingress-nginx-controller
          - -n
          - ingress-nginx
          - --type=merge
          - -p
          - '{{ {''spec'': {''type'': ''NodePort'', ''ports'': [{''name'': ''http'', ''port'': 80, ''targetPort'':
            ''http'', ''nodePort'': nginx_nodeport_http | default(lab_nodeports.legacy_nginx_http) | int},
            {''name'': ''https'', ''port'': 443, ''targetPort'': ''https'', ''nodePort'': nginx_nodeport_https
            | default(lab_nodeports.legacy_nginx_https) | int}]}} | to_json }}'
      register: legacy_service
      changed_when: '''(no change)'' not in legacy_service.stdout'
    - name: Wait for deployment/ingress-nginx-controller
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/ingress-nginx-controller
          - -n
          - ingress-nginx
          - --timeout=300s
      changed_when: false
  vars_files:
    - ../vars/common.yml
