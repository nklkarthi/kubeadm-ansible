---
- name: Reconcile monitoring through an Argo CD Application
  hosts: '{{ control_plane_hosts }}[0]'
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    tool_name: kube-prometheus-stack chart 93.1.0
    tool_kubernetes_min: 1.25.0
    tool_kubernetes_max: 1.38.0
  tasks:
    - name: Run tasks/cluster_access.yml
      ansible.builtin.import_tasks: ../tasks/cluster_access.yml
      tags:
        - compatibility
    - name: Require the Argo CD application CRD
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - crd
          - applications.argoproj.io
      changed_when: false
    - name: Prepare the monitoring namespace before its administrator secret
      ansible.builtin.include_tasks: ../tasks/namespace.yml
      vars:
        addon_namespace: monitoring
    - name: Inspect the installation's existing Grafana credentials
      ansible.builtin.command: kubectl get secret kube-prometheus-stack-grafana -n monitoring --ignore-not-found -o name
      register: monitoring_admin_secret
      changed_when: false
    - name: Create administrator credentials only for a new installation
      when: monitoring_admin_secret.stdout | length == 0
      block:
        - name: Generate a private Grafana administrator password
          ansible.builtin.command: openssl rand -hex 24
          register: monitoring_admin_password
          changed_when: false
          no_log: true
        - name: Store the installation's credentials independently of Helm rendering
          ansible.builtin.include_tasks: ../tasks/apply_manifest.yml
          vars:
            manifest_private: true
            manifest_definition:
              apiVersion: v1
              kind: Secret
              metadata: {name: kube-prometheus-stack-grafana, namespace: monitoring}
              type: Opaque
              data:
                admin-user: '{{ "admin" | b64encode }}'
                admin-password: '{{ monitoring_admin_password.stdout | b64encode }}'
    - name: Reconcile the kube-prometheus-stack Argo CD application
      ansible.builtin.include_tasks: ../tasks/apply_manifest.yml
      vars:
        manifest_definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: kube-prometheus-stack
            namespace: '{{ argocd_namespace | default("argocd") }}'
          spec:
            project: default
            source:
              repoURL: https://prometheus-community.github.io/helm-charts
              chart: kube-prometheus-stack
              targetRevision: '{{ prometheus_chart_version | default(tool_versions.prometheus_stack) }}'
              helm:
                valuesObject:
                  grafana:
                    admin:
                      existingSecret: kube-prometheus-stack-grafana
                      userKey: admin-user
                      passwordKey: admin-password
                    sidecar:
                      resources:
                        requests: {cpu: 10m, memory: 16Mi}
                        limits: {cpu: 100m, memory: 128Mi}
                    resources:
                      requests: {cpu: 50m, memory: 128Mi}
                      limits: {cpu: 500m, memory: 512Mi}
                    service:
                      type: NodePort
                      nodePort: '{{ lab_nodeports.grafana | int }}'
                  prometheus:
                    prometheusSpec:
                      retention: 6h
                      retentionSize: 256MB
                      resources:
                        requests: {cpu: 100m, memory: 256Mi}
                        limits: {cpu: '1', memory: 1Gi}
                    service:
                      type: NodePort
                      nodePort: '{{ lab_nodeports.prometheus | int }}'
                  alertmanager:
                    alertmanagerSpec:
                      resources:
                        requests: {cpu: 10m, memory: 32Mi}
                        limits: {cpu: 250m, memory: 256Mi}
                    service:
                      type: NodePort
                      nodePort: '{{ lab_nodeports.alertmanager | int }}'
                  prometheusOperator:
                    resources:
                      requests: {cpu: 25m, memory: 64Mi}
                      limits: {cpu: 500m, memory: 256Mi}
                    prometheusConfigReloader:
                      resources:
                        requests: {cpu: 10m, memory: 16Mi}
                        limits: {cpu: 100m, memory: 64Mi}
                  kube-state-metrics:
                    resources:
                      requests: {cpu: 25m, memory: 64Mi}
                      limits: {cpu: 250m, memory: 256Mi}
                  prometheus-node-exporter:
                    resources:
                      requests: {cpu: 10m, memory: 16Mi}
                      limits: {cpu: 100m, memory: 64Mi}
            destination:
              server: https://kubernetes.default.svc
              namespace: monitoring
            syncPolicy:
              automated:
                prune: false
                selfHeal: true
              syncOptions:
                - ServerSideApply=true
                - CreateNamespace=true
        manifest_private: false
      when: not ansible_check_mode
    - name: Inspect previous chart ownership of the preserved administrator secret
      ansible.builtin.command:
        argv: [kubectl, get, secret, kube-prometheus-stack-grafana, -n, monitoring, '-o=jsonpath={.metadata.annotations.argocd\.argoproj\.io/tracking-id}']
      register: monitoring_secret_tracking
      changed_when: false
    - name: Transfer the existing administrator secret out of chart reconciliation
      ansible.builtin.command: kubectl annotate secret kube-prometheus-stack-grafana -n monitoring argocd.argoproj.io/tracking-id-
      when: monitoring_secret_tracking.stdout | length > 0
      changed_when: true
    - name: Wait for kube-prometheus-stack to reconcile the selected chart revision
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/kube-prometheus-stack
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.sync.revision}={{ prometheus_chart_version | default(tool_versions.prometheus_stack)
            }}
          - --timeout=600s
      changed_when: false
    - name: Wait for kube-prometheus-stack synchronization
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/kube-prometheus-stack
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.sync.status}=Synced
          - --timeout=600s
      changed_when: false
    - name: Wait for kube-prometheus-stack health
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/kube-prometheus-stack
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.health.status}=Healthy
          - --timeout=600s
      changed_when: false
  vars_files:
    - ../vars/common.yml
