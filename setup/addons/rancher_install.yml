---
- name: Install Rancher only on a supported management cluster
  hosts: '{{ control_plane_hosts }}[0]'
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    tool_name: Rancher 2.15 plus cert-manager 1.21
    tool_kubernetes_min: 1.34.0
    tool_kubernetes_max: 1.37.0
  tasks:
    - name: Run tasks/cluster_access.yml
      ansible.builtin.import_tasks: ../tasks/cluster_access.yml
      tags:
        - compatibility
    - name: Require an explicit Rancher hostname and non-default bootstrap secret
      ansible.builtin.assert:
        that:
          - rancher_host is defined
          - bootstrap_password is defined
          - bootstrap_password | default("") | length >= 12
        fail_msg: Set rancher_host and bootstrap_password (12+ characters), preferably through Ansible Vault.
      no_log: true
    - name: Require the Argo CD application CRD
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - crd
          - applications.argoproj.io
      changed_when: false
    - name: Reconcile the cert-manager Argo CD application
      ansible.builtin.include_tasks: ../tasks/apply_manifest.yml
      vars:
        manifest_definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cert-manager
            namespace: '{{ argocd_namespace | default("argocd") }}'
          spec:
            project: default
            source:
              repoURL: https://charts.jetstack.io
              chart: cert-manager
              targetRevision: '{{ certmanager_version | default(tool_versions.cert_manager) }}'
              helm:
                valuesObject:
                  crds:
                    enabled: true
            destination:
              server: https://kubernetes.default.svc
              namespace: cert-manager
            syncPolicy:
              automated:
                prune: false
                selfHeal: true
              syncOptions:
                - ServerSideApply=true
                - CreateNamespace=true
        manifest_private: false
      when: not ansible_check_mode
    - name: Wait for cert-manager to reconcile the selected chart revision
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/cert-manager
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.sync.revision}={{ certmanager_version | default(tool_versions.cert_manager)
            }}
          - --timeout=600s
      changed_when: false
    - name: Wait for cert-manager synchronization
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/cert-manager
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.sync.status}=Synced
          - --timeout=600s
      changed_when: false
    - name: Wait for cert-manager health
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/cert-manager
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.health.status}=Healthy
          - --timeout=600s
      changed_when: false
    - name: Reconcile the rancher Argo CD application
      ansible.builtin.include_tasks: ../tasks/apply_manifest.yml
      vars:
        manifest_definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: rancher
            namespace: '{{ argocd_namespace | default("argocd") }}'
          spec:
            project: default
            source:
              repoURL: https://releases.rancher.com/server-charts/stable
              chart: rancher
              targetRevision: '{{ rancher_version | default(tool_versions.rancher) }}'
              helm:
                valuesObject:
                  hostname: '{{ rancher_host }}'
                  bootstrapPassword: '{{ bootstrap_password }}'
                  replicas: 1
                  ingress:
                    enabled: false
                  service:
                    type: NodePort
            destination:
              server: https://kubernetes.default.svc
              namespace: cattle-system
            syncPolicy:
              automated:
                prune: false
                selfHeal: true
              syncOptions:
                - ServerSideApply=true
                - CreateNamespace=true
                - RespectIgnoreDifferences=true
            ignoreDifferences:
              - group: ''
                kind: Service
                name: rancher
                namespace: cattle-system
                jqPathExpressions:
                  - .spec.ports[].nodePort
        manifest_private: true
      when: not ansible_check_mode
    - name: Wait for rancher to reconcile the selected chart revision
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/rancher
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.sync.revision}={{ rancher_version | default(tool_versions.rancher) }}
          - --timeout=600s
      changed_when: false
    - name: Wait for rancher synchronization
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/rancher
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.sync.status}=Synced
          - --timeout=600s
      changed_when: false
    - name: Wait for rancher health
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - application/rancher
          - -n
          - '{{ argocd_namespace | default("argocd") }}'
          - --for=jsonpath={.status.health.status}=Healthy
          - --timeout=600s
      changed_when: false
    - name: Expose Rancher on unique lab ports
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - service
          - rancher
          - -n
          - cattle-system
          - --type=strategic
          - -p
          - '{{ {''spec'': {''type'': ''NodePort'', ''ports'': [{''port'': 80, ''nodePort'': lab_nodeports.rancher_http
            | int}, {''port'': 443, ''nodePort'': lab_nodeports.rancher_https | int}]}} | to_json }}'
      register: rancher_ports
      changed_when: '''(no change)'' not in rancher_ports.stdout'
    - name: Configure Rancher server URL after its CRD is ready
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - settings.management.cattle.io
          - server-url
          - --type=merge
          - -p
          - '{{ {''value'': ''https://'' ~ rancher_host ~ '':'' ~ lab_nodeports.rancher_https} | to_json }}'
      register: rancher_url
      changed_when: '''(no change)'' not in rancher_url.stdout'
      until: rancher_url.rc == 0
      retries: 6
      delay: 5
  vars_files:
    - ../vars/common.yml
