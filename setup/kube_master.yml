- name: Configure Kubernetes master
  hosts: master
  become: true
  vars:
    kube_user: "{{ target_user | default('cloud_user') }}"
    cni: "{{ cni_plugin | default('calico') }}"   # calico | cilium | none
    calico_version: "{{ calico_ver | default('v3.30.0') }}"
    kube_bench_version: "{{ bench_version | default('v0.15.0') }}"
  tasks:
    - name: Create an Empty file for Kubeadm configuring
      ansible.builtin.copy:
        content: ""
        dest: /etc/kubernetes/kubeadm-config.yaml
        force: false
        mode: "0644"
    - name: Configure container runtime
      ansible.builtin.blockinfile:
        path: /etc/kubernetes/kubeadm-config.yaml
        block: |
          kind: ClusterConfiguration
          apiVersion: kubeadm.k8s.io/v1beta3
          controlPlaneEndpoint: "{{ ansible_facts['default_ipv4']['address'] }}:6443"
          networking:
            podSubnet: "10.244.0.0/16"
          ---
          kind: KubeletConfiguration
          apiVersion: kubelet.config.k8s.io/v1beta1
          runtimeRequestTimeout: "15m"
          cgroupDriver: "systemd"
    - name: Remove existing containerd config
      ansible.builtin.file:
        path: /etc/containerd/config.toml
        state: absent
    - name: Generate new containerd config
      ansible.builtin.shell: >
        containerd config default > /etc/containerd/config.toml
      changed_when: false
    - name: Enable CRI plugin in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins = \["cri"\]'
        replace: 'disabled_plugins = []'
    - name: Configure systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
    - name: Restart containerd service
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true
    - name: Wait for containerd to be ready
      ansible.builtin.wait_for:
        path: /var/run/containerd/containerd.sock
        timeout: 30
    - name: Initialize the cluster
      ansible.builtin.shell: |
        kubeadm init --config /etc/kubernetes/kubeadm-config.yaml \
          >> cluster_initialized.log 2>&1
      args:
        chdir: /home/{{ kube_user }}
      failed_when: false
      changed_when: false
      register: kubeadm_result
    - name: Show kubeadm result
      ansible.builtin.debug:
        msg: "Kubeadm init return code: {{ kubeadm_result.rc }}"
    - name: Check kubeadm init log
      ansible.builtin.stat:
        path: /home/{{ kube_user }}/cluster_initialized.log
      register: init_log_stat
    - name: Display kubeadm init log if exists
      ansible.builtin.command: cat /home/{{ kube_user }}/cluster_initialized.log
      when: init_log_stat.stat.exists
      register: init_log_content
      failed_when: false
      changed_when: false
    - name: Show init log content
      ansible.builtin.debug:
        var: init_log_content.stdout_lines
      when: init_log_stat.stat.exists
    - name: Create .kube directory
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.file:
        path: /home/{{ kube_user }}/.kube
        state: directory
        mode: "0755"
    - name: Check if admin.conf exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf_stat
    - name: Copy admin.conf to User's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ kube_user }}/.kube/config
        remote_src: true
        owner: "{{ kube_user }}"
        mode: "0644"
      when: admin_conf_stat.stat.exists
    - name: Install Calico CNI
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.shell: |
        export KUBECONFIG=/home/{{ kube_user }}/.kube/config
        kubectl apply -f \
          https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
      args:
        chdir: "/home/{{ kube_user }}"
      when: admin_conf_stat.stat.exists and cni == 'calico'
      changed_when: false
    - name: Install Cilium CNI
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.shell: |
        set -o pipefail
        export KUBECONFIG=/home/{{ kube_user }}/.kube/config
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        curl -sL "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz" \
          | tar xz -C /usr/local/bin
        cilium install --set kubeProxyReplacement=false
      args:
        chdir: "/home/{{ kube_user }}"
      when: admin_conf_stat.stat.exists and cni == 'cilium'
      changed_when: false
    - name: Show CNI skipped message
      ansible.builtin.debug:
        msg: "CNI installation skipped. Install your CNI manually before joining workers."
      when: cni == 'none'
    - name: Install Kubernetes Metrics Server
      become: true
      become_user: "{{ kube_user }}"
      tags: metrics_server
      ansible.builtin.shell: >
        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
      args:
        chdir: "/home/{{ kube_user }}"
      changed_when: true
    - name: Patch metrics-server with --kubelet-insecure-tls
      become: true
      become_user: "{{ kube_user }}"
      tags: metrics_server
      ansible.builtin.shell: >
        kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
      args:
        chdir: "/home/{{ kube_user }}"
      changed_when: true
    - name: Download kube-bench deb package
      ansible.builtin.get_url:
        url: >-
          https://github.com/aquasecurity/kube-bench/releases/download/{{ kube_bench_version }}/kube-bench_{{
          kube_bench_version | regex_replace('^v', '') }}_linux_amd64.deb
        dest: /tmp/kube-bench.deb
        mode: "0644"

    - name: Install kube-bench
      ansible.builtin.apt:
        deb: /tmp/kube-bench.deb
        state: present

    - name: Remove kube-bench deb package
      ansible.builtin.file:
        path: /tmp/kube-bench.deb
        state: absent

    - name: Fetch kubeconfig from master
      ansible.builtin.fetch:
        src: /home/{{ kube_user }}/.kube/config
        dest: /tmp/kubeconfig-kubeadm-lab
        flat: true
      when: admin_conf_stat.stat.exists

- name: Merge kubeconfig into local Mac
  hosts: localhost
  gather_facts: false
  vars:
    temp_config: "/tmp/kubeconfig-kubeadm-lab"
    master_host: "{{ groups['master'][0] }}"

  tasks:
    - name: Check temp kubeconfig exists
      ansible.builtin.stat:
        path: "{{ temp_config }}"
      register: temp_config_stat

    - name: Replace private IP with public hostname in kubeconfig
      ansible.builtin.shell: |
        set -o pipefail
        PRIVATE_IP=$(kubectl --kubeconfig {{ temp_config }} config view \
          -o jsonpath='{.clusters[0].cluster.server}' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
        sed "s|https://${PRIVATE_IP}:6443|https://{{ master_host }}:6443|g" \
          {{ temp_config }} > {{ temp_config }}.new
        mv {{ temp_config }}.new {{ temp_config }}
      when: temp_config_stat.stat.exists
      changed_when: true

    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0755"
      when: temp_config_stat.stat.exists

    - name: Create ~/.kube/config if it does not exist
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        state: touch
        mode: "0600"
      when: temp_config_stat.stat.exists

    - name: Merge kubeconfig into ~/.kube/config
      ansible.builtin.shell: |
        set -o pipefail
        KUBECONFIG={{ temp_config }}:{{ lookup('env', 'HOME') }}/.kube/config \
          kubectl config view --flatten > /tmp/kubeconfig-merged
        mv /tmp/kubeconfig-merged {{ lookup('env', 'HOME') }}/.kube/config
      when: temp_config_stat.stat.exists
      changed_when: true

    - name: Remove temp kubeconfig
      ansible.builtin.file:
        path: "{{ temp_config }}"
        state: absent
      when: temp_config_stat.stat.exists

    - name: Show kubeconfig merge result
      ansible.builtin.debug:
        msg: |
          kubernetes-admin@kubernetes context updated in ~/.kube/config

          Switch context : kubectl config use-context kubernetes-admin@kubernetes
          List contexts  : kubectl config get-contexts
      when: temp_config_stat.stat.exists

    - name: Show kubeconfig skipped warning
      ansible.builtin.debug:
        msg: "WARNING: kubeconfig not fetched - kubeadm init may have failed on master"
      when: not temp_config_stat.stat.exists
