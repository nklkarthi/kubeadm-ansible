  - tcpdump
  - util-linux
  - xfsprogs
linux_platforms:
  RedHat:
    packages: [bind-utils, cronie, firewalld, httpd, iproute, iputils, openssh-clients, openssh-server, policycoreutils-python-utils, procps-ng, python3-libselinux, sos, vim-enhanced]
    services: [chronyd, firewalld, crond, atd]
    http_service: httpd
    http_config: /etc/httpd/conf.d/lfcs-lab.conf
    http_validate: [httpd, -t]
    container_mac: selinuxEnabled
  Debian:
    packages: [aardvark-dns, apache2, apparmor, apparmor-utils, cron, dnsutils, iproute2, iputils-ping, netavark, openssh-client, openssh-server, procps, slirp4netns, sosreport, ufw, uidmap, vim]
    services: [chrony, cron, atd, apparmor]
    http_service: apache2
    http_config: /etc/apache2/sites-available/linux-lab.conf
    http_validate: [apache2ctl, -t]
    container_mac: apparmorEnabled
linux_platform: '{{ linux_platforms[ansible_facts.os_family] }}'
linux_ubuntu_remote_client_packages: [cifs-utils, open-iscsi, nfs-common, smbclient, ldap-utils]
