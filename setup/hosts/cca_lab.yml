---
- name: Release the unused worker's memory for the separate mesh cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/common.yml
  tasks:
    - name: Require the explicit Cilium lab inventory
      ansible.builtin.assert:
        that:
          - groups['mesh_hosts'] | default([]) | length == 1
          - groups['mesh_hosts'] | intersect(groups[cluster_hosts]) | length == 0
- name: Stop worker-02 while the small second cluster is in use
  import_playbook: vagrant.yml
  vars:
    vagrant_state: stopped
    vagrant_nodes: [worker-02]
- name: Provision the main Cilium nodes and the independent mesh guest
  import_playbook: vagrant.yml
  vars:
    vagrant_nodes: [master, worker-01, mesh-01]
- name: Verify CPU and network stability on the selected guests
  import_playbook: ../../tests/local_vms.yml
