---
- name: Prepare controller tools through Homebrew
  hosts: localhost
  connection: local
  become: false
  gather_subset: [min]
  vars_files:
    - ../vars/common.yml
  vars:
    controller_brew_binary: '{{ "/home/linuxbrew/.linuxbrew/bin/brew" if ansible_facts.system == "Linux" else ("/opt/homebrew/bin/brew" if ansible_facts.architecture in ["arm64", "aarch64"] else "/usr/local/bin/brew") }}'
    controller_required_tools: >-
      {{ [{"formula": "helm", "command": "helm", "version": tool_versions.helm, "version_args": ["version", "--short"]},
          {"formula": "crane", "command": "crane", "version": tool_versions.crane, "version_args": ["version"]}]
         + ([{"formula": "kyverno", "command": "kyverno", "version": tool_versions.kyverno, "version_args": ["version"]}]
            if 'kyverno' in certification_addons | default([]) else [])
         + ([{"formula": "cilium-cli", "command": "cilium", "version": tool_versions.cilium_cli, "version_args": ["version", "--client"]},
             {"formula": "hubble", "command": "hubble", "version": tool_versions.hubble_cli, "version_args": ["version"]}]
            if cni_plugin | default('calico') == 'cilium' else []) }}
  environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'
  tasks:
    - name: Require a supported macOS or Linux controller
      ansible.builtin.assert:
        that:
          - ansible_facts.system in ['Linux', 'Darwin']
          - ansible_facts.architecture in ['x86_64', 'aarch64', 'arm64']
    - name: Locate the controller's Homebrew installation
      ansible.builtin.command:
        argv: ['{{ controller_brew_binary }}', --prefix]
      register: controller_brew_prefix
      changed_when: false
      check_mode: false
    - name: Inspect only the packages required by this certification
      ansible.builtin.command:
        argv: ['{{ controller_brew_binary }}', list, --formula, --versions, '{{ item.formula }}']
      loop: '{{ controller_required_tools }}'
      loop_control:
        label: '{{ item.formula }}'
      register: controller_brew_packages
      changed_when: false
      failed_when: controller_brew_packages.rc not in [0, 1]
      check_mode: false
    - name: Install only missing controller packages
      ansible.builtin.command:
        argv: ['{{ controller_brew_binary }}', install, '{{ item.item.formula }}']
      loop: '{{ controller_brew_packages.results }}'
      loop_control:
        label: '{{ item.item.formula }}'
      when: item.rc == 1
      changed_when: true
    - name: Verify package-managed tools match the tested release pins
      ansible.builtin.command:
        argv: '{{ [controller_brew_prefix.stdout ~ "/bin/" ~ item.command] + item.version_args }}'
      loop: '{{ controller_required_tools }}'
      loop_control:
        label: '{{ item.command }} {{ item.version }}'
      register: controller_package_version
      changed_when: false
      failed_when: controller_package_version.stdout is not search('(?<![0-9])' ~ (item.version | regex_replace('^v', '') | regex_escape) ~ '(?![0-9])')
    - name: Select the verified package-managed binary paths
      ansible.builtin.set_fact:
        controller_binaries: '{{ controller_binaries | default({}) | combine({item.command: controller_brew_prefix.stdout ~ "/bin/" ~ item.command}) }}'
      loop: '{{ controller_required_tools }}'
      loop_control:
        label: '{{ item.command }}'
    - name: Record that the selected controller tools are available
      ansible.builtin.set_fact:
        controller_tools_ready: true
