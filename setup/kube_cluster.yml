---
- name: Validate the selected lab inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/common.yml
  tasks:
    - name: Validate node roles before configuring the cluster
      ansible.builtin.import_tasks: tasks/cluster_inventory.yml
- name: Prepare controller tools only when the selected setup needs them
  import_playbook: hosts/controller_tools.yml
  when: (cni_plugin | default('calico') == 'cilium' or controller_image_cache | default(false) | bool) and
    not hostvars.localhost.controller_tools_ready | default(false) | bool
- name: Setup Kubernetes Cluster
  import_playbook: hosts/firewall.yml
- name: Install Kubernetes Dependencies
  import_playbook: cluster/kube_dependencies.yml
- name: Configure Master Node
  import_playbook: cluster/kube_master.yml
- name: Configure Worker Nodes
  import_playbook: cluster/kube_workers.yml
- name: Issue verified serving certificates for the selected kubelets
  import_playbook: cluster/kubelet_certificates.yml
- name: Verify the functional base cluster
  import_playbook: cluster/verify_cluster.yml
  when: cni_plugin | default('calico') != 'none'
- name: Test DNS and cross-worker services after fresh bootstrap or when requested
  import_playbook: ../tests/cluster_network.yml
  when: >-
    groups[worker_hosts] | length >= 2 and
    (verify_network | default(false) | bool or
    hostvars[groups[control_plane_hosts][0]].kubeadm_initialized.changed | default(false) | bool or
    groups[worker_hosts] | map('extract', hostvars, ['worker_config', 'stat', 'exists']) |
    select('equalto', false) | list | length > 0)
