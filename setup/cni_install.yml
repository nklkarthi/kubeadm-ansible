---
- name: Install CNI plugin on existing cluster
  hosts: master
  become: true
  vars:
    kube_user: "{{ target_user | default('cloud_user') }}"
    cni: "{{ cni_plugin | default('cilium') }}"   # cilium | calico
    calico_version: "{{ calico_ver | default('v3.30.0') }}"

  tasks:
    - name: Check CNI is not already installed
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.shell: |
        set -o pipefail
        export KUBECONFIG=/home/{{ kube_user }}/.kube/config
        kubectl get pods -n kube-system | grep -E "calico|cilium"
      args:
        executable: /bin/bash
      register: cni_check
      failed_when: false
      changed_when: false

    - name: Show already installed message
      ansible.builtin.debug:
        msg: "CNI already installed: {{ cni_check.stdout_lines }}"
      when: cni_check.rc == 0

    - name: Install Calico CNI
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.shell: |
        export KUBECONFIG=/home/{{ kube_user }}/.kube/config
        kubectl apply -f \
          https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
      args:
        chdir: "/home/{{ kube_user }}"
      when: cni == 'calico' and cni_check.rc != 0
      changed_when: true

    - name: Install Cilium CNI
      # cilium CLI managed via Homebrew on localhost - no install needed on master
      ansible.builtin.shell: |
        KUBECONFIG=/home/{{ kube_user }}/.kube/config \
          cilium install --set kubeProxyReplacement=false
      delegate_to: localhost
      become: false
      when: cni == 'cilium' and cni_check.rc != 0
      changed_when: true

    - name: Wait for CNI pods to be ready
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.shell: |
        export KUBECONFIG=/home/{{ kube_user }}/.kube/config
        kubectl rollout status daemonset/calico-node -n kube-system --timeout=180s
      args:
        chdir: "/home/{{ kube_user }}"
      when: cni == 'calico'
      changed_when: false
      failed_when: false

    - name: Wait for Cilium to be ready
      ansible.builtin.shell: |
        KUBECONFIG=/home/{{ kube_user }}/.kube/config \
          cilium status --wait --wait-duration 180s
      delegate_to: localhost
      become: false
      when: cni == 'cilium'
      changed_when: false
      failed_when: false

    - name: Get node status after CNI install
      become: true
      become_user: "{{ kube_user }}"
      ansible.builtin.shell: |
        export KUBECONFIG=/home/{{ kube_user }}/.kube/config
        kubectl get nodes -o wide
      args:
        chdir: "/home/{{ kube_user }}"
      register: node_status
      changed_when: false

    - name: Show node status
      ansible.builtin.debug:
        msg: |
          CNI ({{ cni }}) installed successfully!

          {{ node_status.stdout }}

          Next step - join workers:
            ansible-playbook kube_workers.yml
