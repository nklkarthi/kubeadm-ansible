---
- name: Recover control plane
  hosts: '{{ control_plane_hosts }}'
  serial: 1
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Run the shared node operation
      ansible.builtin.import_tasks: ../tasks/recover_node.yml
  vars_files:
    - ../vars/common.yml
- name: Recover workers
  hosts: '{{ worker_hosts }}'
  serial: 1
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Run the shared node operation
      ansible.builtin.import_tasks: ../tasks/recover_node.yml
  vars_files:
    - ../vars/common.yml
