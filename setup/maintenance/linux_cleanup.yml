---
- name: Stop and destroy both Linux practice VMs and their writable disks
  import_playbook: ../hosts/vagrant.yml
  vars:
    vagrant_state: absent
    vagrant_nodes: [lfcs, lfca]
- name: Remove regenerable lab caches while retaining keys and verification reports
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/common.yml
  vars:
    cleanup_provider: '{{ "hyperv" if lookup("ansible.builtin.env", "WSL_DISTRO_NAME") | length > 0 else "virtualbox" }}'
  tasks:
    - name: Remove downloaded and imported lab cache files
      ansible.builtin.file:
        path: '{{ repository_root }}/artifacts/{{ item }}'
        state: absent
      loop: [downloads, images, charts, helm-values, disposable]
    - name: Remove stale entries from Vagrant's machine index
      ansible.builtin.command:
        argv: ['{{ repository_root }}/scripts/vagrant.sh', global-status, --prune]
      changed_when: false
    - name: Read remaining lab box cache entries
      ansible.builtin.command:
        argv: ['{{ repository_root }}/scripts/vagrant.sh', box, list, --machine-readable]
      register: linux_cleanup_boxes
      changed_when: false
    - name: Remove unused lab base boxes without forcing removal of boxes still in use
      ansible.builtin.command:
        argv: ['{{ repository_root }}/scripts/vagrant.sh', box, remove, '{{ item }}', '--provider={{ cleanup_provider }}', --all, --no-tty]
        stdin: 'n'
      loop: [almalinux/10, gusztavvargadr/ubuntu-server-2404-lts, bento/ubuntu-24.04]
      when: item in linux_cleanup_boxes.stdout
      register: linux_cleanup_box
      changed_when: linux_cleanup_box.rc == 0 and 'Removing box' in linux_cleanup_box.stdout
      failed_when: linux_cleanup_box.rc != 0 and (linux_cleanup_box.stdout ~ linux_cleanup_box.stderr) is not search('(?i)in use|being used')
