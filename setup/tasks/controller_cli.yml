---
- name: Create the selected versioned controller CLI directory
  ansible.builtin.file:
    path: '{{ repository_root }}/.tools/{{ controller_cli.name }}-{{ controller_cli.version }}'
    state: directory
    mode: '0700'
- name: Check whether the selected CLI is already installed
  ansible.builtin.stat:
    path: '{{ repository_root }}/.tools/{{ controller_cli.name }}-{{ controller_cli.version }}/{{ controller_cli.name }}'
  register: controller_selected_cli
- name: Download and verify the selected CLI release
  ansible.builtin.get_url:
    url: '{{ controller_cli.url }}'
    checksum: 'sha256:{{ controller_cli.url }}.sha256sum'
    dest: '{{ repository_root }}/artifacts/downloads/{{ controller_cli.name }}-{{ controller_cli.version }}-{{ controller_os }}-{{ controller_arch }}.tar.gz'
    mode: '0600'
    timeout: 60
  when: not controller_selected_cli.stat.exists
  register: controller_selected_download
  until: controller_selected_download is succeeded
  retries: 3
  delay: 5
- name: Extract only the selected CLI binary
  ansible.builtin.unarchive:
    src: '{{ repository_root }}/artifacts/downloads/{{ controller_cli.name }}-{{ controller_cli.version }}-{{ controller_os }}-{{ controller_arch }}.tar.gz'
    dest: '{{ repository_root }}/.tools/{{ controller_cli.name }}-{{ controller_cli.version }}'
    include: ['{{ controller_cli.name }}']
    creates: '{{ repository_root }}/.tools/{{ controller_cli.name }}-{{ controller_cli.version }}/{{ controller_cli.name }}'
  when: not controller_selected_cli.stat.exists
- name: Activate the matching CLI version
  ansible.builtin.file:
    src: '{{ repository_root }}/.tools/{{ controller_cli.name }}-{{ controller_cli.version }}/{{ controller_cli.name }}'
    dest: '{{ repository_root }}/.tools/bin/{{ controller_cli.name }}'
    state: link
    force: true
- name: Verify the activated CLI reports its pinned version
  ansible.builtin.command:
    argv: '{{ [repository_root ~ "/.tools/bin/" ~ controller_cli.name] + controller_cli.version_args | default(["version"]) }}'
  register: controller_selected_version
  changed_when: false
  failed_when: controller_cli.version not in controller_selected_version.stdout
