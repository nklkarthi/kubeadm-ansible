---
- name: Fetch the selected control-plane credentials for Helm
  ansible.builtin.import_tasks: controller_access.yml
- name: Create the controller chart cache
  ansible.builtin.file:
    path: '{{ repository_root }}/artifacts/charts'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
- name: Download and verify the pinned chart archive
  ansible.builtin.get_url:
    url: '{{ helm_chart_source.url }}'
    checksum: '{{ helm_chart_source.checksum }}'
    dest: '{{ repository_root }}/artifacts/charts/{{ helm_release_name }}-{{ helm_chart_version }}.tgz'
    mode: '0600'
    timeout: 60
  delegate_to: localhost
  become: false
- name: Create the private Helm values directory
  ansible.builtin.file:
    path: '{{ repository_root }}/artifacts/helm-values'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
- name: Write the declared Helm values
  ansible.builtin.copy:
    dest: '{{ repository_root }}/artifacts/helm-values/{{ helm_release_name }}.yaml'
    content: '{{ helm_values | to_nice_yaml }}'
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: '{{ helm_private | default(false) | bool }}'
- name: Read the existing Helm release
  ansible.builtin.command:
    argv:
      - '{{ repository_root }}/.tools/bin/helm'
      - list
      - --namespace
      - '{{ helm_namespace }}'
      - --kubeconfig
      - '{{ controller_kubeconfig }}'
      - --filter
      - ^{{ helm_release_name }}$
      - --output
      - json
  delegate_to: localhost
  become: false
  register: selected_helm_release
  changed_when: false
  check_mode: false
- name: Read the installed Helm overrides
  ansible.builtin.command:
    argv:
      - '{{ repository_root }}/.tools/bin/helm'
      - get
      - values
      - '{{ helm_release_name }}'
      - --namespace
      - '{{ helm_namespace }}'
      - --kubeconfig
      - '{{ controller_kubeconfig }}'
      - --output
      - json
  delegate_to: localhost
  become: false
  register: selected_helm_values
  changed_when: false
  check_mode: false
  when: selected_helm_release.stdout | from_json | length > 0
  no_log: '{{ helm_private | default(false) | bool }}'
- name: Determine whether the pinned chart or declared values changed
  ansible.builtin.set_fact:
    helm_release_matches: '{{ selected_helm_release.stdout | from_json | length > 0 and (selected_helm_release.stdout
      | from_json)[0].status == ''deployed'' and (selected_helm_release.stdout | from_json)[0].chart == helm_chart_name
      ~ ''-'' ~ helm_chart_version and (selected_helm_values.stdout | default(''{}'', true) | from_json | default({},
      true)) == helm_values }}'
  no_log: '{{ helm_private | default(false) | bool }}'
- name: Reconcile only a missing or changed Helm release
  ansible.builtin.command:
    argv:
      - '{{ repository_root }}/.tools/bin/helm'
      - upgrade
      - --install
      - --reset-values
      - --no-hooks
      - '{{ helm_release_name }}'
      - '{{ repository_root }}/artifacts/charts/{{ helm_release_name }}-{{ helm_chart_version }}.tgz'
      - --namespace
      - '{{ helm_namespace }}'
      - --create-namespace
      - --kubeconfig
      - '{{ controller_kubeconfig }}'
      - --values
      - '{{ repository_root }}/artifacts/helm-values/{{ helm_release_name }}.yaml'
      - --timeout
      - 10m
  delegate_to: localhost
  become: false
  changed_when: true
  when: not helm_release_matches | bool
  no_log: '{{ helm_private | default(false) | bool }}'
- name: Read the deployed release resources
  ansible.builtin.command:
    argv:
      - '{{ repository_root }}/.tools/bin/helm'
      - get
      - manifest
      - '{{ helm_release_name }}'
      - --namespace
      - '{{ helm_namespace }}'
      - --kubeconfig
      - '{{ controller_kubeconfig }}'
  delegate_to: localhost
  become: false
  register: helm_installed_manifest
  changed_when: false
  no_log: '{{ helm_private | default(false) | bool }}'
- name: Select workload controllers from the deployed chart
  ansible.builtin.set_fact:
    helm_workloads: '{{ helm_installed_manifest.stdout | from_yaml_all | select("mapping") | selectattr("kind",
      "in", ["Deployment", "StatefulSet", "DaemonSet"]) | list }}'
  no_log: '{{ helm_private | default(false) | bool }}'
- name: Cache images requested by the new chart workloads
  ansible.builtin.include_tasks: preload_pod_images.yml
- name: Wait for the chart's actual workload controllers
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - '{{ item.kind | lower }}/{{ item.metadata.name }}'
      - --namespace
      - '{{ item.metadata.namespace | default(helm_namespace) }}'
      - --timeout=600s
  loop: '{{ helm_workloads }}'
  loop_control:
    label: '{{ item.kind }}/{{ item.metadata.name }}'
  changed_when: false
