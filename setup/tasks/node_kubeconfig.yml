---
- name: Create the selected administrator's kubeconfig directory
  ansible.builtin.file:
    path: /home/{{ kube_user }}/.kube
    state: directory
    owner: '{{ kube_user }}'
    mode: '0700'
- name: Check for completed control-plane credentials
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf_stat
- name: Install the node administrator's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ kube_user }}/.kube/config
    remote_src: true
    owner: '{{ kube_user }}'
    mode: '0600'
  when: admin_conf_stat.stat.exists
  no_log: true
  diff: false
