---
- name: Configure a distinct controller kubeconfig context
  delegate_to: localhost
  become: false
  block:
    - name: Select the destination and context
      ansible.builtin.set_fact:
        local_config_path: '{{ local_kubeconfig | default(lookup(''ansible.builtin.env'', ''HOME'') ~ ''/.kube/config'')
          }}'
        local_context_name: '{{ local_kube_context | default((lab_environment | default(''vbox'')) ~ ''-kubeadm'')
          }}'
    - name: Check the existing controller kubeconfig
      ansible.builtin.stat:
        path: '{{ local_config_path }}'
      register: local_config_stat
    - name: Read existing credentials without contacting their clusters
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - '{{ local_config_path }}'
          - config
          - view
          - --raw
          - --flatten
          - -o
          - json
      when: local_config_stat.stat.exists
      register: current_local_config
      changed_when: false
      check_mode: false
      no_log: true
    - name: Load current and fetched credential documents
      ansible.builtin.set_fact:
        fetched_config: '{{ lookup(''ansible.builtin.file'', fetched_kubeconfig | default(repository_root ~
          ''/artifacts/kubeconfig'')) | from_yaml }}'
        preserved_config: '{{ (current_local_config.stdout | from_json) if local_config_stat.stat.exists else
          {''apiVersion'': ''v1'', ''kind'': ''Config''} }}'
      no_log: true
    - name: Require one source cluster, user and context
      ansible.builtin.assert:
        that:
          - fetched_config.clusters | length == 1
          - fetched_config.users | length == 1
          - fetched_config.contexts | length == 1
      no_log: true
    - name: Rename fetched entries while preserving other environments
      ansible.builtin.set_fact:
        merged_clusters: '{{ (preserved_config.clusters | default([], true) | rejectattr(''name'', ''equalto'',
          local_context_name) | list) + [fetched_config.clusters[0] | combine({''name'': local_context_name})]
          }}'
        merged_users: '{{ (preserved_config.users | default([], true) | rejectattr(''name'', ''equalto'', local_context_name
          ~ ''-admin'') | list) + [fetched_config.users[0] | combine({''name'': local_context_name ~ ''-admin''})]
          }}'
        merged_contexts: '{{ (preserved_config.contexts | default([], true) | rejectattr(''name'', ''equalto'',
          local_context_name) | list) + [fetched_config.contexts[0] | combine({''name'': local_context_name,
          ''context'': fetched_config.contexts[0].context | combine({''cluster'': local_context_name, ''user'':
          local_context_name ~ ''-admin''})})] }}'
      no_log: true
    - name: Protect the controller credentials directory
      ansible.builtin.file:
        path: '{{ local_config_path | dirname }}'
        state: directory
        mode: '0700'
    - name: Back up and atomically install the selected context
      ansible.builtin.copy:
        dest: '{{ local_config_path }}'
        content: '{{ preserved_config | combine({''clusters'': merged_clusters, ''users'': merged_users, ''contexts'':
          merged_contexts, ''current-context'': local_context_name}) | to_nice_yaml(sort_keys=false) }}'
        mode: '0600'
        backup: true
      register: local_kubeconfig_result
      no_log: true
