---
- name: Read the guest UTC epoch
  ansible.builtin.command: date +%s
  register: guest_utc_epoch
  changed_when: false
  check_mode: false
- name: Read the controller UTC epoch
  ansible.builtin.command: date +%s
  delegate_to: localhost
  become: false
  register: controller_utc_epoch
  changed_when: false
  check_mode: false
  run_once: true
- name: Correct a large lab clock offset before TLS and repository operations
  ansible.builtin.command:
    argv:
      - date
      - -u
      - --set=@{{ controller_utc_epoch.stdout }}
  when:
    - lab_time_from_controller | default(false) | bool
    - ((controller_utc_epoch.stdout | int) - (guest_utc_epoch.stdout | int)) | abs > 60
  changed_when: true
- name: Read available clock synchronization services
  ansible.builtin.service_facts: null
- name: Select the installed NTP implementation
  ansible.builtin.set_fact:
    node_time_service: '{{ "chrony" if "chrony.service" in ansible_facts.services else "systemd-timesyncd"
      }}'
- name: Install a small NTP client when no supported service is installed
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - '''chrony.service'' not in ansible_facts.services'
    - '''systemd-timesyncd.service'' not in ansible_facts.services'
- name: Enable ongoing clock synchronization
  ansible.builtin.systemd_service:
    name: '{{ node_time_service }}'
    enabled: true
    state: started
- name: Read the system time synchronization setting
  ansible.builtin.command: timedatectl show -p NTP --value
  register: node_ntp_enabled
  changed_when: false
- name: Enable time synchronization through the system time service
  ansible.builtin.command: timedatectl set-ntp true
  when: node_ntp_enabled.stdout != 'yes'
  changed_when: true
