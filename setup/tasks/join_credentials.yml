---
- name: Read the selected cluster CA
  ansible.builtin.slurp:
    src: /etc/kubernetes/pki/ca.crt
  register: cluster_ca
  no_log: true
- name: Read the cluster discovery endpoint
  ansible.builtin.command:
    argv: [kubectl, config, view, --kubeconfig=/etc/kubernetes/admin.conf, -o, 'jsonpath={.clusters[0].cluster.server}']
  register: discovery_endpoint
  changed_when: false
  check_mode: false
- name: Hash the discovery CA public key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl pkey -pubin -outform DER | openssl dgst -sha256 -hex
    executable: /bin/bash
  register: discovery_hash
  changed_when: false
  check_mode: false
- name: Create a one-hour token only for pending joins
  ansible.builtin.command:
    argv: [kubeadm, token, create, --ttl, 1h]
  register: bootstrap_token
  no_log: true
  changed_when: true
  when: pending_join_hosts | length > 0 and not ansible_check_mode
