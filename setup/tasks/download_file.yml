---
- name: Download on the guest when controller caching is disabled
  ansible.builtin.get_url:
    url: "{{ download_spec.url }}"
    dest: "{{ download_spec.dest }}"
    checksum: "{{ download_spec.checksum | default(omit) }}"
    mode: '{{ download_spec.mode | default("0644") }}'
    timeout: "{{ download_spec.timeout | default(60) }}"
    owner: "{{ download_spec.owner | default(omit) }}"
    group: "{{ download_spec.group | default(omit) }}"
  when: not download_via_controller | default(false) | bool
  register: guest_download_result
  until: guest_download_result is succeeded
  retries: '{{ download_spec.retries | default(3) }}'
  delay: 5
  notify: "{{ download_notify | default([]) }}"
- name: Cache verified downloads on the controller
  when: download_via_controller | default(false) | bool
  block:
    - name: Select the controller cache path
      ansible.builtin.set_fact:
        controller_download_path: '{{ repository_root }}/artifacts/downloads/{{ download_spec.url | hash("sha256") }}/{{ download_spec.url | urlsplit("path") | basename
          }}'
    - name: Create the private download cache directory
      ansible.builtin.file:
        path: "{{ controller_download_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
    - name: Download and verify the pinned file on macOS or WSL
      ansible.builtin.get_url:
        url: "{{ download_spec.url }}"
        dest: "{{ controller_download_path }}"
        checksum: "{{ download_spec.checksum | default(omit) }}"
        mode: "0600"
        timeout: "{{ download_spec.timeout | default(60) }}"
      delegate_to: localhost
      become: false
      throttle: 1
      register: controller_download_result
      until: controller_download_result is succeeded
      retries: '{{ download_spec.retries | default(3) }}'
      delay: 5
    - name: Transfer only the required file to the guest
      ansible.builtin.copy:
        src: "{{ controller_download_path }}"
        dest: "{{ download_spec.dest }}"
        mode: '{{ download_spec.mode | default("0644") }}'
        owner: "{{ download_spec.owner | default(omit) }}"
        group: "{{ download_spec.group | default(omit) }}"
      notify: "{{ download_notify | default([]) }}"
