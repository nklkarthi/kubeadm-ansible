---
- name: Validate the selected certification before replacing local VMs
  import_playbook: validate_profile.yml
  vars:
    certification_fresh_run: true
- name: Replace the managed guests and verify their new identities and CPU stability
  import_playbook: hosts/fresh_vms.yml
- name: Install and test the selected certification on the clean guests
  import_playbook: certification_lab.yml
