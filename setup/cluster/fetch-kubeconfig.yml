---
- name: Fetch current control-plane credentials to WSL
  hosts: '{{ control_plane_hosts | default(''vbox_master'') }}[0]'
  become: true
  gather_facts: false
  tasks:
    - name: Protect local credential directory
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: '{{ repository_root }}/artifacts'
        state: directory
        mode: '0700'
    - name: Fetch the current cluster CA and administrator credentials
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: '{{ repository_root }}/artifacts/kubeconfig'
        flat: true
    - name: Protect the fetched kubeconfig
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: '{{ repository_root }}/artifacts/kubeconfig'
        mode: '0600'
    - name: Configure kubectl on the Ansible controller
      ansible.builtin.import_tasks: ../tasks/install_local_kubeconfig.yml
  vars_files:
    - ../vars/common.yml
